version: "2"
sql:
  - engine: postgresql
    # The Supabase CLI migrations are the single schema source (AD13).
    schema: ../supabase/migrations
    # One query file per capability (auth.sql, events.sql, ...), no shared append point.
    queries: db/queries
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        emit_interface: false
        emit_pointers_for_null_types: true
        emit_enum_valid_method: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
